<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLpedia · Conceptos fundamentales</title><style>
:root{--bg:#101115;--panel:#1b1d24;--line:#353945;--teal:#23b4aa;--red:#ff3228;--muted:#afb2bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f7;font:15px/1.65 system-ui,sans-serif}a{color:var(--teal)}.shell{max-width:1160px;margin:auto;padding:0 22px}.head{border-bottom:1px solid var(--line);padding:18px 0}.bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}.brand{color:white;font-size:23px;font-weight:800;text-decoration:none}.brand b{color:var(--red)}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{font-size:13px;text-decoration:none;color:var(--muted)}nav a.active{color:white}.hero{padding:35px 0 20px}.hero h1{font-size:clamp(29px,4vw,48px);line-height:1.2}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:44px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.card h2{font-size:20px;margin:6px 0 10px}.card p{font-size:13px;color:#ced0d8}.tag{color:var(--teal);font-weight:700;font-size:11px;letter-spacing:.8px}.formula{font:13px/1.5 ui-monospace,monospace;background:#0d0f14;padding:12px;border-radius:9px;overflow:auto;white-space:pre-wrap}.related{font-size:12px;color:var(--muted);margin-top:15px}input{background:var(--panel);border:1px solid var(--line);color:white;width:100%;padding:13px;border-radius:10px;font:inherit;margin:0 0 20px}@media(max-width:500px){.grid{grid-template-columns:1fr}.shell{padding:0 13px}}
</style></head><body><header class="head"><div class="shell bar"><a href="index.html" class="brand">ML<b>pedia</b> 2.0</a><nav><a href="index.html">ML clásico</a><a href="explorar.html">DL y RL</a><a href="comparar.html">Comparador</a><a href="laboratorios.html">Laboratorios</a><a class="active" href="conceptos.html">Conceptos</a><a href="rutas.html">Rutas</a></nav></div></header><main class="shell"><section class="hero"><div class="tag">BASE TEÓRICA · 15 CONCEPTOS</div><h1>Conceptos para entender los algoritmos</h1><p class="muted">Definiciones, formulación compacta y relación con las arquitecturas o algoritmos del catálogo. Estos conceptos no se contabilizan como modelos.</p></section><input id="search" aria-label="Buscar conceptos" placeholder="Buscar Bellman, Adam, atención, entropía..."><div class="grid" id="cards"></div></main><script>
let DATA=[];const $=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const q=$("search").value.toLowerCase();$("cards").innerHTML=DATA.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q)).map(x=>'<article class="card"><div class="tag">'+(x.area==="DL"?"DEEP LEARNING":"REINFORCEMENT LEARNING")+'</div><h2>'+esc(x.name)+'</h2><p>'+esc(x.description)+'</p><div class="formula">'+esc(x.formula)+'</div><div class="related">Relacionado: '+esc(x.related)+'</div></article>').join("")||'<p>Sin coincidencias.</p>';}
$("search").addEventListener("input",render);fetch("content/concepts-v2.json").then(r=>r.json()).then(x=>{DATA=x;render()}).catch(e=>{$("cards").textContent="No se pudieron cargar los conceptos: "+e.message});
</script></body></html>
