<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLpedia · Rutas de aprendizaje</title><style>

<script>
const paths=[
{id:"neural",name:"De perceptrón a Transformers",desc:"Bases del aprendizaje de representaciones y arquitecturas profundas.",items:[["Perceptrón","explorar.html#v2-01"],["MLP","explorar.html#v2-02"],["Backpropagation","conceptos.html"],["CNN","explorar.html#v2-04"],["ResNet","explorar.html#v2-05"],["Transformer","explorar.html#v2-11"],["Attention: laboratorio","laboratorios.html#attention"]]},
{id:"rl",name:"De Bellman a Deep RL",desc:"Primero las dinámicas y tablas Q, después aproximación con redes neuronales.",items:[["MDP y Bellman","conceptos.html"],["Value Iteration","explorar.html#v2-17"],["SARSA","explorar.html#v2-20"],["Q-Learning","explorar.html#v2-21"],["GridWorld: laboratorio","laboratorios.html#gridworld"],["DQN","explorar.html#v2-23"],["PPO","explorar.html#v2-28"],["Objetivos DQN/PPO","laboratorios.html#deep-rl"]]},
{id:"gen",name:"Representaciones y generación",desc:"De reconstrucción y latentes probabilísticos a modelos generativos.",items:[["Autoencoder","explorar.html#v2-03"],["VAE","explorar.html#v2-14"],["GAN","explorar.html#v2-15"],["Modelos de difusión","explorar.html#v2-16"],["GPT","explorar.html#v2-13"],["Atención: laboratorio","laboratorios.html#attention"]]}];
const KEY="mlpedia:v2:paths";let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){document.getElementById("routes").innerHTML=paths.map(p=>{const n=p.items.filter((_,i)=>done[p.id+":"+i]).length;return '<section class="card"><div class="eyebrow">'+p.items.length+' PASOS</div><h2>'+p.name+'</h2><p>'+p.desc+'</p><div class="progress"><div style="width:'+(100*n/p.items.length)+'%"></div></div><div class="count">'+n+' de '+p.items.length+' completados</div>'+p.items.map(([label,href],i)=>'<div class="step"><input type="checkbox" aria-label="Marcar '+esc(label)+'" data-path="'+p.id+'" data-index="'+i+'" '+(done[p.id+":"+i]?"checked":"")+'><label>'+esc(label)+'</label><a href="'+href+'">Abrir ↗</a></div>').join("")+'</section>';}).join("");for(const input of document.querySelectorAll("[data-path]"))input.addEventListener("change",()=>{done[input.dataset.path+":"+input.dataset.index]=input.checked;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}render();});}render();
</script></body></html>
